<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>🎉 Selamat Datang - Caesar Cipher</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .result-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 94, 0, 0.4);
            border-radius: 20px;
            padding: 50px;
            margin: 100px auto;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.8s ease;
            box-shadow: 0 0 50px rgba(0, 178, 255, 0.2);
        }
        
        .result-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            background: linear-gradient(45deg, #FF5E00, #00B2FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        
        .result-name {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            color: #FF5E00;
            text-shadow: 0 0 20px rgba(255, 94, 0, 0.5);
        }
        
        .encrypt-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00B2FF;
            border-radius: 10px;
            padding: 25px;
            margin: 25px 0;
        }
        
        .encrypt-label {
            color: #00B2FF;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .encrypt-text {
            color: #00B2FF;
            font-family: monospace;
            font-size: 1.3rem;
            word-break: break-all;
            font-weight: bold;
        }
        
        .shift-info {
            margin-top: 12px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #FF5E00, #00B2FF);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 94, 0, 0.5);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 50px;
        }
        
        .copyright {
            opacity: 0.5;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="gradient-overlay"></div>
    <div class="scanlines"></div>
    <div id="particles"></div>

    <nav id="navbar">
        <div class="nav-container">
            <a href="/" class="logo-link">
                <span class="logo-text">⚡ CAESAR CIPHER ⚡</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/histori" class="nav-link">Histori</a></li>
            </ul>
        </div>
    </nav>

    <div class="result-card">
        <h1 class="result-title">🎉 SELAMAT DATANG! 🎉</h1>
        <div class="result-name">Halo, <strong>{{ nama }}</strong>!</div>
        <div class="encrypt-box">
            <div class="encrypt-label">🔐 NAMA TERENKRIPSI</div>
            <div class="encrypt-text">{{ nama_terenkripsi }}</div>
            <div class="shift-info">Shift Caesar: {{ shift }}</div>
        </div>
        <div class="btn-group">
            <a href="/" class="btn">🏠 KEMBALI</a>
            <a href="/histori" class="btn">📜 LIHAT HISTORI</a>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p class="copyright">© 2025 Caesar Cipher | Shift Caesar 3 | Sistem Enkripsi Digital</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
