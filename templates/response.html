<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Selamat Datang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card">
            <div class="card-body text-center">
                <h2>🎉 Selamat Datang! 🎉</h2>
                <p class="fs-3 mt-4">Halo, <strong>{{ nama }}</strong>!</p>
                <div class="alert alert-info">
                    <strong>🔐 Nama terenkripsi:</strong> {{ nama_terenkripsi }}
                    <small class="d-block">(Shift Caesar: {{ shift }})</small>
                </div>
                <a href="/" class="btn btn-primary">Kembali</a>
                <a href="/histori" class="btn btn-secondary">Lihat Histori</a>
            </div>
        </div>
    </div>
</body>
</html>
