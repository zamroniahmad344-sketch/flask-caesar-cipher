<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Caesar Cipher - Enkripsi Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .encrypt-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 94, 0, 0.4);
            border-radius: 20px;
            padding: 50px;
            margin: 100px auto;
            max-width: 550px;
            animation: fadeIn 0.8s ease;
            box-shadow: 0 0 50px rgba(255, 94, 0, 0.2);
        }
        
        .encrypt-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(45deg, #FF5E00, #00B2FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #FF5E00;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 94, 0, 0.3);
            color: white;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FF5E00;
            box-shadow: 0 0 20px rgba(255, 94, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #FF5E00, #00B2FF);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 94, 0, 0.5);
        }
        
        .nav-buttons {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }
        
        .nav-btn {
            padding: 10px 25px;
            background: transparent;
            border: 1px solid #FF5E00;
            color: #FF5E00;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
        }
        
        .nav-btn:hover {
            background: rgba(255, 94, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 94, 0, 0.3);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 50px;
        }
        
        .copyright {
            opacity: 0.5;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="gradient-overlay"></div>
    <div class="scanlines"></div>
    <div id="particles"></div>

    <nav id="navbar">
        <div class="nav-container">
            <a href="/" class="logo-link">
                <span class="logo-text">⚡ CAESAR CIPHER ⚡</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link active">Home</a></li>
                <li><a href="/histori" class="nav-link">Histori</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="encrypt-card">
            <h1 class="encrypt-title">✨ ENKRIPSI CAESAR ✨</h1>
            <form action="/" method="post">
                <div class="form-group">
                    <label>⚡ NAMA DEPAN</label>
                    <input type="text" name="namaDepan" placeholder="Masukkan nama depan..." required>
                </div>
                <div class="form-group">
                    <label>🔮 NAMA BELAKANG</label>
                    <input type="text" name="namaBelakang" placeholder="Masukkan nama belakang..." required>
                </div>
                <button type="submit" class="btn-submit">🚀 ENKRIPSI SEKARANG</button>
            </form>
            <div class="nav-buttons">
                <a href="/histori" class="nav-btn">📜 LIHAT HISTORI</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p class="copyright">© 2025 Caesar Cipher | Shift Caesar 3 | Sistem Enkripsi Digital</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
